name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk  # 代码排版配图的测试要中文字体
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org --build-arg PIP_INDEX_URL=https://pypi.org/simple --build-arg APT_MIRROR=deb.debian.org -t mediaflow:ci .
      - name: smoke test（在线版：要登录、管理员能登进去、前端能打开）
        run: |
          docker run -d --name mf -p 8765:8765 -e MEDIAFLOW_AUTH=password -e MEDIAFLOW_SECRET=ci-secret-0123456789abcdef -e MEDIAFLOW_ADMIN_PASSWORD=ci-admin-123 mediaflow:ci
          for i in $(seq 30); do curl -sf localhost:8765/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/api/accounts)" = 401
          curl -sf -c cj -X POST localhost:8765/api/auth/login -H 'content-type: application/json' -d '{"username":"admin","password":"ci-admin-123"}'
          curl -sf -b cj localhost:8765/api/accounts
          curl -sf localhost:8765/ | grep -q 'id="root"'
      - name: smoke test（演示版：不用登录、设置锁住、口令解锁）
        run: |
          docker run -d --name demo -p 8766:8765 -e MEDIAFLOW_AUTH=demo -e MEDIAFLOW_ADMIN_TOKEN=ci-token-123 mediaflow:ci
          for i in $(seq 30); do curl -sf localhost:8766/health && break; sleep 2; done
          curl -sf localhost:8766/api/accounts
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT localhost:8766/api/settings/llm -H 'content-type: application/json' -d '{"api_key":"sk-x"}')" = 403
          curl -sf -c cj2 -X POST localhost:8766/api/auth/unlock -H 'content-type: application/json' -d '{"token":"ci-token-123"}' | grep -q '"is_admin":true'
      - if: always()
        run: docker logs mf; docker logs demo || true
