# 不用 Docker、用 nginx 反代时的站点配置。放到 /etc/nginx/conf.d/mediaflow.conf，把域名和证书路径换掉。
# 证书：云厂商控制台可以申请免费 DV 证书，或用 certbot / acme.sh。
server {
    listen 80;
    server_name mf.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mf.example.com;

    ssl_certificate     /etc/nginx/ssl/mf.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mf.example.com.key;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 必须带上：后端据此给登录 Cookie 加 Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
