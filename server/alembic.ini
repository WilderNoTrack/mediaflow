# 开发时生成新迁移：
#   uv run alembic revision --autogenerate -m "说明"
# 应用启动时会自动执行 upgrade head，无需手动迁移。
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./data/mediaflow.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(message)s
