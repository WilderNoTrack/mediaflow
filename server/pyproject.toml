[project]
name = "mediaflow"
version = "2.0.0"
description = "MediaFlow（媒力）v2：AI 小红书账号运营助手（本地版）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "openai>=1.40",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[project.scripts]
mediaflow = "mediaflow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mediaflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
